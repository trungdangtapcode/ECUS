name: ecus

x-api: &api
  build:
    context: ..
    dockerfile: services/api/Dockerfile
  env_file: ../.env
  environment:
    DATABASE_URL: ${COMPOSE_DATABASE_URL:?Set COMPOSE_DATABASE_URL in .env}
    STORAGE_ROOT: /app/data/files
  volumes:
    - files:/app/data

services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${DATABASE_PORT:-55434}:5432"
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    <<: *api
    profiles: [app]
    command:
      [
        "sh",
        "-ec",
        "alembic -c services/api/alembic.ini upgrade head && python scripts/seed_reference.py reference-data/declaration-profiles.json",
      ]
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *api
    profiles: [app]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready')",
        ]
      interval: 5s
      timeout: 3s
      retries: 15

  web:
    profiles: [app]
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        VITE_DEFAULT_LOCALE: ${VITE_DEFAULT_LOCALE:-vi}
    ports:
      - "127.0.0.1:${WEB_CONTAINER_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/v1/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 15

volumes:
  database:
  files:
