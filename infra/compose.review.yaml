services:
  review-gateway:
    profiles: [app]
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    volumes:
      - ./review-gateway.conf:/etc/nginx/conf.d/default.conf:ro
      - ${REVIEW_AUTH_FILE:?Run make review-config first}:/etc/nginx/review.htpasswd:ro
    ports:
      - "127.0.0.1:${REVIEW_GATEWAY_PORT:-5180}:8080"
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 5s
      timeout: 3s
      retries: 10
