[project]
name = "ecus-api"
version = "0.1.0"
description = "Customs pre-declaration application foundation"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy[asyncio]>=2.0.36,<2.1",
  "asyncpg>=0.30,<1",
  "alembic>=1.14,<2",
  "httpx>=0.28,<1",
  "pypdf>=6,<7",
  "openpyxl>=3.1,<4",
  "xlrd>=2,<3",
  "olefile>=0.47,<1",
  "pypdfium2>=5,<6",
  "pillow>=12,<13",
  "xlwt>=1.3,<2",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=1,<2",
  "aiosqlite>=0.21,<1",
  "ruff>=0.11,<1",
  "mypy>=1.15,<2",
  "asgi-lifespan>=2.1,<3",
  "types-openpyxl>=3.1,<4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ecus_api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
